<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TulaScan Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* VOICE: calm, practical field tool for cotton growers and agronomy researchers
   IDEA: an agronomist's field notebook that reads a single leaf
   PICTURE: the leaf itself, framed by scan corners, with its attention map
   COLOUR and TYPE: leaf green on pale field ground; N, P, K tints from real symptoms; Space Grotesk + Inter, Hind Siliguri for Bengali
   LAYOUT: phone = top bar + bottom tabs; desktop = sidebar + two-column result */
:root{color-scheme:light dark;
--bg:light-dark(#F4F5EF,#101511);--surface:light-dark(#FFFFFF,#182019);--surface2:light-dark(#ECEFE7,#222A24);
--line:light-dark(#E0E4DA,#2C362E);--line2:light-dark(#C9D0C3,#3C483E);
--ink:light-dark(#16201A,#E6ECE7);--muted:light-dark(#56615A,#A3AFA6);
--pri:light-dark(#1E5B3A,#73C795);--onpri:light-dark(#FFFFFF,#0B2214);--prisoft:light-dark(#E3EEE6,#1C3125);--prihover:light-dark(#164A2E,#8AD6A8);
--warnbg:light-dark(#FBF3E2,#2B2413);--warnink:light-dark(#5C430F,#EFD49A);--warnline:light-dark(#EEDDB6,#4A3C1C);
--badbg:light-dark(#FBE7E3,#33201C);--badink:light-dark(#8A2A17,#F3B3A4);
--H:light-dark(#2F7D4F,#5DB884);--N:light-dark(#B7791F,#D9A441);--P:light-dark(#6B4BA1,#A98BDB);--K:light-dark(#B4532A,#E08A5F);--U:light-dark(#8A948C,#6F7A72);
--Hbg:light-dark(#E3EEE6,#1C3125);--Hink:light-dark(#1E5B3A,#8FD3A4);--Nbg:light-dark(#F6E7C6,#382C12);--Nink:light-dark(#6E4708,#F2CF8A);
--Pbg:light-dark(#EAE3F4,#2A2340);--Pink:light-dark(#4E3480,#CDBAF0);--Kbg:light-dark(#F6DFD3,#3B2318);--Kink:light-dark(#8A3B19,#F2B394);
--Ubg:light-dark(#ECEEE9,#252B26);--Uink:light-dark(#4A554D,#B9C3BB);
--shadow:0 1px 2px rgb(16 24 18/.06),0 6px 20px rgb(16 24 18/.06);
--font:Inter,'Hind Siliguri',system-ui,sans-serif;--disp:'Space Grotesk','Hind Siliguri',Inter,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);overflow-x:clip;-webkit-tap-highlight-color:transparent}
html[lang=bn] body{font-family:'Hind Siliguri',Inter,sans-serif;line-height:1.6}
a{color:var(--pri)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 60%,transparent);outline-offset:2px}
[hidden]{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .acts{display:flex;align-items:center;gap:2px}
main{width:100%;max-width:1120px;margin:0 auto;padding:18px 16px 104px;outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.tabs a[aria-current=page]{color:var(--pri);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.mark{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#1E5B3A;color:#fff;flex:none}
.bname{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--prisoft);color:var(--pri);font-weight:600}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
@media(min-width:900px){
 .app{grid-template-columns:244px minmax(0,1fr)}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
 .top,.tabs{display:none}
 main{padding:30px 40px 56px}
}
.app.bare{grid-template-columns:minmax(0,1fr)}.app.bare .side,.app.bare .top,.app.bare .tabs{display:none}
.app.bare main{max-width:none;padding:0}
.title{font-family:var(--disp);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance;outline:none}
html[lang=bn] .title{line-height:1.3;letter-spacing:0}
.sec{font-size:16px;font-weight:600;margin:0}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.45}.center{text-align:center}
p{margin:0}
.stackv{display:flex;flex-direction:column;gap:16px}.tight{gap:6px}
.headrow{display:flex;align-items:center;gap:6px;margin:0 0 18px}
.headrow .iconbtn{margin-left:-10px}
.headrow .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.card h3{font-size:15px;font-weight:600;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:13px;border:1px solid transparent;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.btn-pri{background:var(--pri);color:var(--onpri)}.btn-pri:hover{background:var(--prihover)}
.btn-out{background:var(--surface);color:var(--ink);border-color:var(--line2)}.btn-out:hover{background:var(--surface2)}
.btn-ghost{background:transparent;color:var(--pri)}.btn-ghost:hover{background:var(--prisoft)}
.btn-danger{background:#B3261E;color:#fff}.btn-danger:hover{background:#951F18}
.danger{color:var(--badink)}
.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}.btns .btn{flex:1 1 180px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;flex:none}
.iconbtn:hover{background:var(--surface2)}
.pillbtn{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface2);border-radius:12px;padding:3px}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;padding:0 12px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .bn{font-family:'Hind Siliguri',sans-serif}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warnbg);border:1px solid var(--warnline);color:var(--warnink);font-size:14px;line-height:1.45}
.notice .ic{margin-top:2px}
/* welcome */
.welcome{min-height:100vh;display:grid;place-items:center;padding:24px 20px 32px}
.wbox{width:100%;max-width:1000px;display:grid;gap:24px;grid-template-areas:"brand" "art" "text"}
.wbrand{grid-area:brand;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wart{grid-area:art}.wtext{grid-area:text;display:flex;flex-direction:column;gap:16px}
.wtext .title{font-size:clamp(30px,5vw,48px);line-height:1.05}
.lead{font-size:17px;color:var(--muted);max-width:34em}
@media(min-width:860px){.wbox{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"brand brand" "text art";align-items:center;column-gap:48px}}
.wart{position:relative;aspect-ratio:5/4;border-radius:28px;background:var(--prisoft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--pri) 25%,transparent);aspect-ratio:1}
.r1{width:82%}.r2{width:60%}
.frame{position:relative;width:52%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.frame svg{width:86%;height:auto}
.cn{position:absolute;width:15%;aspect-ratio:1;border:3px solid var(--pri)}
.cn.tl{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:12px}.cn.tr{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.cn.bl{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:12px}.cn.br{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.sl{position:absolute;left:6%;right:6%;top:60%;height:2px;background:var(--pri);opacity:.55}
.nb{position:absolute;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.nb.N{top:11%;right:13%;background:var(--Nbg);color:var(--Nink)}.nb.P{bottom:12%;left:11%;background:var(--Pbg);color:var(--Pink)}.nb.K{bottom:22%;right:8%;background:var(--Kbg);color:var(--Kink)}
/* home */
.homegrid{display:grid;gap:16px}
@media(min-width:1000px){.homegrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.hero{position:relative;overflow:hidden;border-radius:22px;background:#1E5B3A;color:#fff;padding:22px;display:flex;flex-direction:column;gap:16px}
.hero .deco{position:absolute;right:-40px;top:-34px;width:190px;opacity:.14}
.hero h1{font-family:var(--disp);font-size:clamp(24px,3vw,30px);font-weight:600;margin:0;outline:none}
.hero p{color:#D6E6DA;max-width:30em}
.hero .btn-w{background:#fff;color:#1E5B3A}.hero .btn-w:hover{background:#E3EEE6}
.hero .btn-o{border-color:rgb(255 255 255/.5);color:#fff;background:transparent}.hero .btn-o:hover{background:rgb(255 255 255/.1)}
.hero .btns{position:relative}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.homegrid>.card{display:flex;flex-direction:column}.homegrid .stats{flex:1}.stat{justify-content:flex-end;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600}
.stat b{font-family:var(--disp);font-size:26px;line-height:1.1}
@media(max-width:480px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tip{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.3}
.tip .tic{width:34px;height:34px;border-radius:10px;background:var(--prisoft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
@media(min-width:1000px){.tips{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 8px}
.lnk{font-size:14px;font-weight:600;text-decoration:none;padding:10px 0;display:inline-block}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ilink{display:flex;align-items:center;gap:12px;flex:1;min-height:52px;color:var(--ink);text-decoration:none;border-radius:10px}
.ilink img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2)}
.itx{flex:1;display:flex;flex-direction:column;gap:1px}
.it1{font-size:15px;font-weight:600}.it2{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.H.pill,.H.cb,.H.stat,.H.gthumb{background:var(--Hbg);color:var(--Hink)}.N.pill,.N.cb,.N.stat,.N.gthumb{background:var(--Nbg);color:var(--Nink)}
.P.pill,.P.cb,.P.stat,.P.gthumb{background:var(--Pbg);color:var(--Pink)}.K.pill,.K.cb,.K.stat,.K.gthumb{background:var(--Kbg);color:var(--Kink)}
.U.pill,.U.cb,.U.stat{background:var(--Ubg);color:var(--Uink)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.search{position:relative}.search .ic{position:absolute;left:14px;top:15px;color:var(--muted)}
.search input{padding-left:42px}
/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:14px;font-weight:600}
.field label span{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=url],select{width:100%;height:48px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--pri);height:28px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-weight:500;background:var(--surface)}
.opt input{width:18px;height:18px;accent-color:var(--pri);margin:0}
.opt:has(input:checked){border-color:var(--pri);background:var(--prisoft)}
pre{margin:0;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;overflow-x:auto}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* scan */
.scangrid{display:grid;gap:16px}
@media(min-width:1000px){.scangrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.vf{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;max-height:58vh;width:100%;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(60% 45% at 18% 20%,#55643F 0%,transparent 100%),radial-gradient(55% 45% at 88% 30%,#45553A 0%,transparent 100%),radial-gradient(70% 50% at 75% 90%,#54442F 0%,transparent 100%),#232B21;transition:outline-color .15s;outline:3px dashed transparent;outline-offset:-10px}
@media(min-width:700px){.vf{aspect-ratio:16/11}}
.vf.drag{outline-color:#8FD3A4}
.vf .frame{width:auto;height:64%}.vf .cn{border-color:#fff}
.vf .ghost{width:78%;opacity:.55}
.vfpill{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgb(0 0 0/.55);font-size:13px;font-weight:500;white-space:nowrap}
.vfdrop{position:absolute;bottom:16px;left:16px;right:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#D9E4DC;text-align:center}
.tiprow{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.tiprow .tic{width:30px;height:30px;border-radius:9px;background:var(--prisoft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.sample{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font-size:13px;font-weight:600}
.sample:hover{border-color:var(--pri)}
.sample img,.sample .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--surface2);display:block}
/* photo + results */
.two{display:grid;gap:18px}
@media(min-width:1000px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:28px}.stick{position:sticky;top:24px}}
.photo{position:relative;border-radius:18px;overflow:hidden;background:#1B231D;display:flex;align-items:center;justify-content:center;min-height:220px}
.pwrap{position:relative;line-height:0}
.pwrap img{display:block;max-width:100%;max-height:min(58vh,480px);width:auto;height:auto}
.pwrap .hm{position:absolute;inset:0;width:100%;height:100%;max-height:none;opacity:.9}
.legend{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgb(0 0 0/.62);color:#fff;font-size:12px;font-weight:500;line-height:1}
.legend i{width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#263A96,#22A0AA,#F2D43A,#E2301A)}
.qrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.st{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.st.good{background:var(--prisoft);color:var(--pri)}.st.warn{background:var(--warnbg);color:var(--warnink)}.st.bad{background:var(--badbg);color:var(--badink)}
.qt{flex:1;display:flex;flex-direction:column;gap:2px;font-size:15px}
.qv{font-size:14px;white-space:nowrap}.qv.good{color:var(--pri)}.qv.warn{color:var(--warnink)}.qv.bad{color:var(--badink)}
.rlabel{font-size:13px;font-weight:600;color:var(--muted)}
.rhead{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.rtitle{font-family:var(--disp);font-size:clamp(22px,2.4vw,27px);line-height:1.15;font-weight:600;margin:0}
.cb{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.cb.lg{width:48px;height:48px;border-radius:14px;font-size:21px}
.confrow{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.confrow b{font-size:24px;color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.bar.sm{height:6px;margin:6px 0 0 38px}
.crow{padding:7px 0}.crt{display:flex;align-items:center;gap:10px;font-size:15px}.crt .cn2{flex:1}
.stacked{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:4px 0 12px}
.lgd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:14px}
.lgd span{display:flex;align-items:center;gap:7px}.lgd i{width:10px;height:10px;border-radius:3px;flex:none}.lgd b{margin-left:auto}
.sim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin-top:8px}
.tag{padding:3px 9px;border-radius:999px;background:var(--surface2)}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.olist li{display:flex;gap:10px;align-items:flex-start}
.num{width:24px;height:24px;border-radius:50%;background:var(--prisoft);color:var(--pri);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.savedtag{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:13px;background:var(--prisoft);color:var(--pri);font-weight:600;flex:1 1 180px}
.utop{display:flex;align-items:center;gap:12px}
.uicon{width:44px;height:44px;border-radius:12px;background:var(--Ubg);color:var(--Uink);display:flex;align-items:center;justify-content:center;flex:none}
/* guide */
.ggrid{display:grid;gap:12px}
@media(min-width:900px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gcard{display:flex;gap:14px;align-items:flex-start}
.gthumb{width:76px;height:76px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.gh{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin:0}
.soft{background:var(--surface2);border-color:transparent}
dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:14px}
dt{color:var(--muted)}dd{margin:2px 0 0;font-weight:600}
ul.lim{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
/* overlays */
.busy{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;align-items:center;justify-content:center;padding:24px}
.bbox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.bart{position:relative;width:190px;height:190px;border-radius:24px;overflow:hidden;background:#1B231D}
.bart img{width:100%;height:100%;object-fit:cover;display:block}
.scanline{position:absolute;left:0;right:0;top:8%;height:3px;background:#8FD3A4;box-shadow:0 0 14px #8FD3A4;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:90%}}
@media(prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}
.btitle{font-family:var(--disp);font-size:20px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.steps li .ic{opacity:0}.steps li.done{color:var(--ink)}.steps li.done .ic{opacity:1;color:var(--pri)}.steps li.now{color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;z-index:50;background:rgb(8 14 10/.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:600px){.scrim{align-items:center}}
.modal{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgb(0 0 0/.25)}
.modal h2{margin:0;font-size:19px;font-family:var(--disp)}
.mrow{display:flex;gap:10px;margin-top:10px}.mrow .btn{flex:1}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media(min-width:900px){.toast{bottom:28px;left:calc(50% + 122px)}}
</style>

 <section class="card"><h3>${esc(t('all'))}</h3>${o.map(c=>`<div class="crow"><div class="crt"><span class="cb ${c}">${c}</span><span class="cn2">${esc(t('c_'+c))}</span><b>${pct(s.probs[c])}</b></div><div class="bar sm"><i style="width:${(s.probs[c]*100).toFixed(1)}%;background:var(--${c})"></i></div></div>`).join('')}</section>
 <section class="card"><h3>${esc(t('looks'))}</h3><p>${esc(t('d_'+k))}</p>${k!=='H'?simHTML(k):''}<a class="lnk" href="#guide">${esc(t('guide_link'))}</a></section>
 <section class="card"><h3>${esc(t('act'))}</h3>${k==='H'?`<p>${esc(t('h_note'))}</p>`:`<ol class="olist">${['act1','act2','act3'].map((a,i)=>`<li><span class="num">${num(i+1)}</span>${esc(t(a))}</li>`).join('')}</ol>`}</section>
 ${notice('',t('r_disc'))}${s.source!=='api'?`<p class="small muted">${esc(t('demo_note'))}</p>`:''}
 <div class="btns">${actButtons(s,isCur)}<a class="btn btn-out" href="#scan">${esc(t('another'))}</a>${isCur?'':`<button class="btn btn-ghost danger" data-act="del" data-id="${esc(s.id)}">${ic('trash',18)}${esc(t('del'))}</button>`}</div>
 <p class="small muted center">${esc(t('meta',{m:modelName(s),d:fmtDate(s.createdAt)}))}${s.plot?' · '+esc(s.plot):''}</p></div></div>`}
const simHTML=k=>`<div class="sim"><span class="muted">${esc(t('similar'))}</span>${tx('sim_'+k).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`;
function unclearView(s,isCur,back){const o=order(s),q=s.quality||{},notes=QK.filter(k=>q[k]&&q[k].st!=='good'&&q[k].n).map(k=>[k,q[k].n]);
 const tips=notes.length?notes:[['sun','g1'],['leaf','g2']],iconFor={bright:'sun',sharp:'focus',leaf:'leaf',edges:'focus',bg:'bg',sun:'sun'};
 return `${head(t('r_title'),back)}<div class="two"><div class="stick">${photoBox(s.photo,null)}</div><div class="stackv">
 <section class="stackv tight"><div class="utop"><span class="uicon">${ic('q',22)}</span><h2 class="rtitle">${esc(t('u_title'))}</h2></div>
 <p>${esc(s.reasons&&s.reasons.length?t('u_q'):t('u_low',{p:pct(s.conf),t:num(s.threshold)}))}</p></section>
 <section class="card"><h3>${esc(t('scores'))}</h3><div class="stacked" role="img" aria-label="${esc(o.map(c=>t('c_'+c)+' '+pct(s.probs[c])).join(', '))}">${o.map(c=>`<span style="width:${(s.probs[c]*100).toFixed(1)}%;background:var(--${c})"></span>`).join('')}</div>
 <div class="lgd">${o.map(c=>`<span><i style="background:var(--${c})"></i>${esc(t('sh_'+c))}<b>${pct(s.probs[c])}</b></span>`).join('')}</div></section>
 <section class="card"><h3>${esc(t('better'))}</h3><ul class="olist">${tips.map(([k,n])=>`<li><span class="num">${ic(iconFor[k]||'leaf',14)}</span>${esc(t(n))}</li>`).join('')}</ul></section>
 <div class="btns"><a class="btn btn-pri" href="#scan">${ic('retake',18)}${esc(t('retake2'))}</a>${isCur&&!S.current.saved?`<button class="btn btn-out" data-act="save">${esc(t('save_u'))}</button>`:''}${isCur&&S.current.saved?`<span class="savedtag">${ic('check',18)}${esc(t('saved'))}</span>`:''}${isCur?'':`<button class="btn btn-ghost danger" data-act="del" data-id="${esc(s.id)}">${ic('trash',18)}${esc(t('del'))}</button>`}</div>
 <p class="small muted center">${esc(t('meta',{m:modelName(s),d:fmtDate(s.createdAt)}))}${s.plot?' · '+esc(s.plot):''}</p></div></div>`}

function filtered(){const q=S.q.trim().toLowerCase();return S.scans.filter(s=>(S.filter==='all'||kindOf(s)===S.filter)&&(!q||(s.plot||'').toLowerCase().includes(q)))}
function countLabel(n){return n===1&&S.prefs.lang==='en'?t('n_scan'):t('n_scans',{n:num(n)})}
function listHTML(){const f=filtered();if(!S.scans.length)return `<div class="list"><div class="empty">${ic('leaf',28)}<p>${esc(t('empty'))}</p><a class="btn btn-pri" href="#scan">${esc(t('h_title'))}</a></div></div>`;
 return f.length?`<div class="list">${f.map(s=>itemHTML(s,true)).join('')}</div>`:`<div class="list"><div class="empty"><p>${esc(t('none_f'))}</p></div></div>`}
function historyView(){const f=filtered();
 return `${head(t('hi_title'),'',S.scans.length?`<button class="pillbtn" data-act="export">${ic('dl',16)}${esc(t('export'))}</button>`:'')}
 <div class="stackv" style="gap:12px"><p class="small muted" id="hcount">${esc(countLabel(f.length))}</p>
 <div class="search">${ic('search',18)}<label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">${esc(t('search'))}</label><input id="q" type="search" placeholder="${esc(t('search'))}" value="${esc(S.q)}" autocomplete="off"></div>
 <div class="chips" role="group" aria-label="${esc(t('hi_title'))}">${['all','H','N','P','K','U'].map(k=>`<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${esc(k==='all'?t('f_all'):t('sh_'+k))}</button>`).join('')}</div>
 <div id="hlist">${listHTML()}</div></div>`}

function guideView(){const src=S.prefs.source==='api';const last=S.scans.find(s=>s.source==='api');
 return `${head(t('g_title'),'')}<p class="muted" style="margin:-8px 0 18px">${esc(t('g_sub'))}</p><div class="ggrid">
 ${CLS.map(k=>`<article class="card gcard"><div class="gthumb ${k}">${leafSVG(k,62,t('c_'+k))}</div><div class="stackv tight"><h2 class="gh"><span class="cb ${k}">${k}</span>${esc(t('c_'+k))}</h2><p>${esc(t('d_'+k))}</p>${k!=='H'?simHTML(k):''}</div></article>`).join('')}</div>
 <section class="card soft" style="margin-top:16px"><h3>${esc(t('about'))}</h3><dl>
 <div><dt>${esc(t('ver'))}</dt><dd>${esc(src?(last?last.model:'—'):'Demo v1.0')}</dd></div><div><dt>${esc(t('classes'))}</dt><dd>${esc(t('c_H'))}, N, P, K</dd></div>
 <div><dt>${esc(t('runs'))}</dt><dd>${esc(t(src?'run_api':'run_demo'))}</dd></div><div><dt>${esc(t('thr'))}</dt><dd>${num(S.prefs.threshold)}%</dd></div></dl>
 <h3 style="margin-top:16px">${esc(t('limits'))}</h3><ul class="lim">${['lim1','lim2','lim3'].map(k=>`<li>${esc(t(k))}</li>`).join('')}</ul></section>`}

function prefsView(){const api=S.prefs.source==='api',u=apiBase()||'http://localhost:8000';
 const sample=`{\n  "probabilities": {"healthy": 0.06, "n": 0.82, "p": 0.03, "k": 0.09},\n  "heatmap": "data:image/png;base64,...",\n  "model_version": "v1.0"\n}`;
 return `${head(t('p_title'),'')}<div class="stackv" style="max-width:640px">
 <section class="card stackv"><div class="field"><span class="flabel">${esc(t('lang'))}</span>${langSeg()}</div></section>
 <section class="card stackv"><div class="field"><label for="thr">${esc(t('thr'))}: <b id="thrv">${num(S.prefs.threshold)}%</b></label><input id="thr" type="range" min="40" max="90" step="5" value="${S.prefs.threshold}"><span class="small muted">${esc(t('thr_help'))}</span></div></section>
 <section class="card stackv"><span class="flabel">${esc(t('model'))}</span>
  <label class="opt"><input type="radio" name="src" value="demo"${api?'':' checked'}>${esc(t('m_demo'))}</label><label class="opt"><input type="radio" name="src" value="api"${api?' checked':''}>${esc(t('m_api'))}</label>
  ${api?`<div class="field"><label for="apiUrl">${esc(t('api_url'))}</label><input id="apiUrl" type="url" inputmode="url" autocomplete="off" value="${esc(S.prefs.apiUrl)}" placeholder="http://localhost:8000"></div>
  <p class="small muted">${esc(t('api_help',{u}))}</p><pre><code>${esc(sample)}</code></pre>${notice('',t('api_note'))}<div><button class="btn btn-out" data-act="test">${esc(t('test'))}</button></div>`:''}</section>
 <section class="card stackv"><span class="flabel">${esc(t('storage'))}</span><p class="small muted">${esc(t('st_'+S.storage))} · ${esc(countLabel(S.scans.length))}</p>
  <div class="btns">${S.scans.length?`<button class="btn btn-out danger" data-act="clear">${ic('trash',18)}${esc(t('clear'))}</button>`:''}<a class="btn btn-out" href="#welcome">${esc(t('welcome_again'))}</a></div></section>
 <p class="small muted center">${esc(t('app_line'))}</p></div>`}

/* ---------- chrome & routing ---------- */
const NAV=[['home','home','nav_home'],['scan','cam','nav_scan'],['history','clock','nav_history'],['guide','book','nav_guide']];
const navKey=r=>(r==='scan'||r==='check'||r==='result')?'scan':r.startsWith('result-')?'history':r;
function renderChrome(r){const k=navKey(r),cur=n=>n===k?' aria-current="page"':'';
 $('#sideBrand').innerHTML=`<span class="mark" style="width:36px;height:36px">${ic('leaf',20)}</span><span class="stackv" style="gap:0"><span class="bname">TulaScan</span><span class="small muted">${esc(t('brand_tag'))}</span></span>`;
 $('#sidenav').innerHTML=[...NAV,['prefs','prefs','nav_prefs']].map(([id,i,l])=>`<a href="#${id}"${cur(id)}>${ic(i,20)}${esc(t(l))}</a>`).join('');
 $('#sidefoot').innerHTML=`${langSeg()}<span>${esc(t('st_'+S.storage))}</span>`;
 $('#tabs').innerHTML=NAV.map(([id,i,l])=>`<a href="#${id}"${cur(id)}>${ic(i,22)}${esc(t(l))}</a>`).join('');
 const other=S.prefs.lang==='en'?'bn':'en';
 $('#top').innerHTML=`<a class="brand" href="#home"><span class="mark" style="width:32px;height:32px">${ic('leaf',18)}</span><span class="bname">TulaScan</span></a><div class="acts"><button class="pillbtn" data-act="lang" data-l="${other}" aria-label="${esc(t('lang'))}"${other==='bn'?' lang="bn"':''}>${ic('globe',16)}${other==='bn'?'বাংলা':'English'}</button><a class="iconbtn" href="#prefs" aria-label="${esc(t('nav_prefs'))}"${cur('prefs')}>${ic('prefs',22)}</a></div>`}
function render(nav){
 document.documentElement.lang=S.prefs.lang;
 let r=decodeURIComponent((location.hash||'').slice(1));
 if(!S.prefs.onboarded)r='welcome';else if(!r)r='home';
 let html;
 if(r==='welcome')html=welcomeView();
 else if(r==='scan')html=scanView();
 else if(r==='check'){if(!S.current){location.replace('#scan');return}html=checkView()}
 else if(r==='result'){if(!S.current||!S.current.scan){location.replace('#scan');return}html=resultView(S.current.scan,true)}
 else if(r.startsWith('result-')){const s=S.scans.find(x=>'result-'+x.id===r);if(!s){location.replace('#history');return}html=resultView(s,false)}
 else if(r==='history')html=historyView();else if(r==='guide')html=guideView();else if(r==='prefs')html=prefsView();else{r='home';html=homeView()}
 $('#app').classList.toggle('bare',r==='welcome');$('#view').innerHTML=html;renderChrome(r);
 if(r==='scan')requestAnimationFrame(()=>setTimeout(fillSamples,30));
 if(nav){window.scrollTo(0,0);const h=$('#view h1');if(h)h.focus({preventScroll:true})}}
function fillSamples(){for(const k of SAMPLE_KINDS){const im=$(`img[data-sample="${k}"]`);if(im&&!im.getAttribute('src'))im.src=makeSample(k).thumb}}

/* ---------- actions ---------- */
async function analyze(){const c=S.current;if(!c)return;busy('run');let probs,heat=null,model='demo-1.0',source=S.prefs.source;
 try{stepTo(0);await wait(420);stepTo(1);
  if(source==='api'){const r=await predictRemote(dataURLtoBlob(c.big));probs=r.probs;heat=r.heat;model=r.model}
  else{probs=demoPredict(c.A);await wait(520)}
  stepTo(2);if(source!=='api')heat=heatFor(c.A,topOf(probs));await wait(380);
 }catch(e){busy(false);toast(t('api_err',{e:e&&e.name==='AbortError'?'timeout':(e&&e.message)||'error'}));return}
 const top=topOf(probs),conf=probs[top],reasons=QK.filter(k=>c.q[k].st==='bad'),thr=S.prefs.threshold;
 const m=c.A;c.scan={id:newId(),createdAt:Date.now(),photo:c.photo,heat,probs,top,conf,status:reasons.length||conf<thr/100?'unclear':'ok',reasons,threshold:thr,
  quality:c.q,metrics:{brightness:Math.round(m.bright),sharpness:Math.round(m.sharp),coverage:+m.cover.toFixed(3),background:+m.bgBusy.toFixed(2)},
  plot:(c.plot||'').trim().slice(0,60),stage:c.stage,model,source,sample:c.sample};
 c.saved=false;S.view='photo';busy(false);location.hash='#result'}
function toCSV(){const rows=[['id','date','plot','growth_stage','status','result','confidence','healthy','nitrogen','phosphorus','potassium','brightness','sharpness','leaf_coverage','model','sample']];
 for(const s of S.scans){const m=s.metrics||{};rows.push([s.id,new Date(s.createdAt).toISOString(),s.plot||'',s.stage||'',s.status,s.status==='unclear'?'':s.top,(s.conf||0).toFixed(3),...CLS.map(k=>(s.probs[k]||0).toFixed(3)),m.brightness??'',m.sharpness??'',m.coverage??'',modelName(s),s.sample||''])}
 return rows.map(r=>r.map(v=>{const x=String(v);return/[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')).join('\n')}
async function exportCSV(){const csv=toCSV(),name='tulascan-history-'+new Date().toISOString().slice(0,10)+'.csv';
 if(S.dl){try{await S.dl.save({filename:name,data:csv});toast(t('csv_saved'))}catch(e){toast(t('dl_cancel'))}return}
 if(window.claude){try{await navigator.clipboard.writeText(csv);toast(t('csv_copied'))}catch(e){toast(t('dl_fail'))}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function testConn(){const base=apiBase();try{if(!/^https?:\/\//.test(base))throw 0;const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),5000);
 const r=await fetch(base+'/health',{signal:ctl.signal});clearTimeout(tm);toast(t(r.ok?'conn_ok':'conn_fail'))}catch(e){toast(t('conn_fail'))}}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='lang'){setPref('lang',b.dataset.l);render()}
 else if(a==='start'){setPref('onboarded',true);if(location.hash==='#home')render(true);else location.hash='#home'}
 else if(a==='pick-cam')$('#camIn').click();
 else if(a==='pick-gal')$('#galIn').click();
 else if(a==='sample'){const k=b.dataset.k,sm=makeSample(k);busy('read');await wait(60);try{await useSource(sm.canvas,600,600,k)}finally{busy(false)}}
 else if(a==='analyze')analyze();
 else if(a==='view'){S.view=b.dataset.v;render()}
 else if(a==='save'){if(!S.current||!S.current.scan||S.current.saved)return;S.current.saved=true;const p=S.current.scan.plot;if(p!==S.prefs.lastPlot)setPref('lastPlot',p);await saveScan(S.current.scan);render();toast(t('saved'))}
 else if(a==='filter'){S.filter=b.dataset.f;render()}
 else if(a==='del'){const id=b.dataset.id;if(await confirmBox(t('del_q'),t('del_b'),t('del'))){await removeScan(id);toast(t('deleted'));if(location.hash.startsWith('#result-'))location.hash='#history';else render()}}
 else if(a==='clear'){if(await confirmBox(t('clear_q',{n:num(S.scans.length)}),t('del_b'),t('clear'))){for(const s of [...S.scans])await removeScan(s.id);toast(t('cleared'));render()}}
 else if(a==='export')exportCSV();
 else if(a==='test')testConn()});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='plot'&&S.current)S.current.plot=el.value;
 else if(el.id==='q'){S.q=el.value;$('#hlist').innerHTML=listHTML();$('#hcount').textContent=countLabel(filtered().length)}
 else if(el.id==='thr')$('#thrv').textContent=num(+el.value)+'%'});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='stage'&&S.current)S.current.stage=el.value;
 else if(el.id==='thr')setPref('threshold',+el.value);
 else if(el.name==='src'){setPref('source',el.value);render()}
 else if(el.id==='apiUrl')setPref('apiUrl',el.value.trim());
 else if(el.id==='camIn'||el.id==='galIn'){const f=el.files&&el.files[0];el.value='';loadFile(f)}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z)z.classList.remove('drag')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('drag');loadFile(e.dataTransfer.files&&e.dataTransfer.files[0])});
document.addEventListener('paste',e=>{if(!S.prefs.onboarded)return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();loadFile(it.getAsFile())}});
window.addEventListener('hashchange',()=>render(true));

/* ---------- start ---------- */
const saved=Local.load();
if(saved){S.prefs={...DEF,...(saved.prefs||{})};S.scans=Array.isArray(saved.scans)?saved.scans.filter(s=>s&&s.id&&s.probs):[]}
S.storage=Local.ok?'local':'memory';
render();initCloud();
window.TulaScan={state:S,analyzeGrid,demoPredict,quality,makeSample};
}
</script>
</body>
</html>
